# Robô de verificação (CI): roda sozinho a cada envio de código ao GitHub.
# Se qualquer etapa falhar, o GitHub mostra um X vermelho e você sabe que algo quebrou.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # o robô só pode LER o código, nada mais

jobs:
  backend:
    name: Backend (testes + segurança)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt pip-audit
      - name: Rodar os testes
        run: python -m pytest -q
      - name: Verificar vulnerabilidades nas bibliotecas (pip-audit)
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend (build + segurança)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Verificar o código (lint)
        run: npm run lint
      - name: Construir o site (build)
        run: npm run build
      - name: Verificar vulnerabilidades (npm audit)
        run: npm audit --audit-level=high

  docker:
    name: Docker (as imagens constroem)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagens
        run: docker compose build
