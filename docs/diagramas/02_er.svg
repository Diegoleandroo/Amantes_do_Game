<text x="270" y="660" font-size="13" fill="#444">LANCAMENTO fica sozinha de propósito:</text><text x="270" y="678" font-size="13" fill="#444">guarda o que vem da fonte externa e</text><text x="270" y="696" font-size="13" fill="#444">não se liga aos jogos do catálogo.</text>
<text x="24" y="812" font-size="13" fill="#444">1 = um   N = muitos   |   PK = chave primária   FK = chave estrangeira</text>
<text x="24" y="830" font-size="13" fill="#444">USUARIO liga ao JOGO três vezes: quem cadastrou, quem alterou e quem excluiu.</text></svg>