<text x="344.0" y="527.0" text-anchor="middle" font-size="12.5">Genero · FaixaEtaria · Console · regras · erros</text>
<rect x="700" y="70" width="330" height="150" rx="8" fill="#f4f7fb" stroke="#222" stroke-width="1.5"/>
<text x="865.0" y="94" text-anchor="middle" font-size="14" font-weight="bold">Regra da dependência</text>
<text x="865.0" y="118" text-anchor="middle" font-size="12.5">O código só aponta para dentro.</text>
<text x="865.0" y="135" text-anchor="middle" font-size="12.5">Rotas e adaptadores conhecem os casos de uso;</text>
<text x="865.0" y="152" text-anchor="middle" font-size="12.5">os casos de uso conhecem só as portas;</text>
<text x="865.0" y="169" text-anchor="middle" font-size="12.5">o domínio não conhece ninguém.</text>
<text x="865.0" y="187" text-anchor="middle" font-size="12" fill="#555">(banco, web e JWT são detalhes trocáveis)</text>
<rect x="700" y="250" width="330" height="130" rx="8" fill="#f4f7fb" stroke="#222" stroke-width="1.5"/>
<text x="865.0" y="274" text-anchor="middle" font-size="14" font-weight="bold">Como se liga</text>
<text x="865.0" y="298" text-anchor="middle" font-size="12.5">Adaptador implementa a porta (traço) e a</text>
<text x="865.0" y="315" text-anchor="middle" font-size="12.5">composição acontece em rotas/deps.py</text>
<text x="865.0" y="332" text-anchor="middle" font-size="12.5">(Servicos): único lugar que escolhe qual</text>
<text x="865.0" y="349" text-anchor="middle" font-size="12.5">banco, hash e fonte externa usar.</text>
<rect x="700" y="410" width="330" height="130" rx="8" fill="#eeeeee" stroke="#222" stroke-width="1.5"/>
<text x="865.0" y="434" text-anchor="middle" font-size="14" font-weight="bold">Prova de que funciona</text>
<text x="865.0" y="458" text-anchor="middle" font-size="12.5">Trocar SQLite por MySQL: só DATABASE_URL.</text>
<text x="865.0" y="475" text-anchor="middle" font-size="12.5">Trocar RAWG por IGDB: novo adaptador,</text>
<text x="865.0" y="492" text-anchor="middle" font-size="12.5">casos de uso intactos.</text>
<text x="865.0" y="509" text-anchor="middle" font-size="12.5">Testes dos casos de uso usam fakes, sem banco.</text>
<text x="700" y="580" text-anchor="start" font-size="11.5" fill="#555">Cores: azul = núcleo · amarelo = portas · cinza = fora</text></svg>