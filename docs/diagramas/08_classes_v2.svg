<text x="24" y="600" text-anchor="start" font-size="11.5" fill="#555">Jogo ↔ Console é muitos-para-muitos (tabela jogo_console). Cada usuário tem no máximo 1 Avaliacao por Jogo (nova nota substitui a antiga).</text>
<text x="24" y="620" text-anchor="start" font-size="11.5" fill="#555">Jogo guarda 3 vezes o Usuario (cadastrou / alterou / excluiu). Lancamento não se liga a Jogo: é só vitrine, trocada inteira a cada rotina.</text></svg>