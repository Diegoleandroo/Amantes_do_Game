<text x="24" y="560" text-anchor="start" font-size="11.5" fill="#555">Hoje tudo roda no seu computador (iniciar.bat). Em produção: AMBIENTE=producao, JWT_SEGREDO forte, COOKIE_SEGURO=true, HTTPS, MySQL e rotina agendada.</text>
<text x="24" y="580" text-anchor="start" font-size="11.5" fill="#555">O navegador também baixa as imagens de capa diretamente do IGDB (images.igdb.com).</text></svg>