<text x="24" y="610" text-anchor="start" font-size="11.5" fill="#555">Cliente–servidor: o navegador só pede e mostra; regras e dados ficam no servidor. Não é microsserviço: a API é um deploy só.</text>
<text x="24" y="628" text-anchor="start" font-size="11.5" fill="#555">A rotina é um 2º processo do mesmo código: grava os lançamentos no banco e a API só lê. O navegador busca as imagens de capa direto do IGDB.</text></svg>