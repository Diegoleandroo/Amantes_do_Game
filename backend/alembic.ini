# Só para quem usa a linha de comando (dentro de backend/):
#   alembic upgrade head                              aplica as migrações
#   alembic revision --autogenerate -m "descrição"    cria uma nova a partir das mudanças em modelos.py
# O sistema aplica as migrações sozinho ao iniciar (app/adaptadores/persistencia/migracoes/aplicar.py).
[alembic]
script_location = app/adaptadores/persistencia/migracoes
prepend_sys_path = .
